# Инфраструктура auth-service. Подключается через include из корневого compose.yml.
# Redis общий — описан в корневом compose.yml.
# Порты совпадают с auth-service/src/main/resources/application.yml.

services:

  auth-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5433:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U auth -d auth" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP-ловушка: принимает все письма и показывает их в браузере, наружу ничего не отправляет
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: [ "CMD", "/mailpit", "readyz" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auth-postgres-data: