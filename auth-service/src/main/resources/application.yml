server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5433/auth
    username: auth
    password: auth

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  threads:
    virtual:
      enabled: true

app:
  mail:
    from: no-reply@sho.rt
    confirm-url: http://localhost:3000/confirm
    reset-url: http://localhost:3000/reset-password

  outbox:
    relay-delay: 2s

  jwt:
    issuer: sho.rt/auth
    access-token-ttl: 15m
    private-key: ${JWT_PRIVATE_KEY:file:./secrets/jwt-private.pem}
    public-key: ${JWT_PUBLIC_KEY:file:./secrets/jwt-public.pem}
    key-id: auth-1

logging:
  level:
    kz.amixady.auth: DEBUG