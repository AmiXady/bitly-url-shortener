server:
  port: 8080

spring:
  application:
    name: gateway-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
          issuer-uri: sho.rt/auth

  cloud:
    gateway:
      server:
        webflux:
          routes:
            #auth serivce
            - id: auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**, /.well-known/**

            #link service
            - id: links
              uri: ${LINK_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/links, /api/links/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health